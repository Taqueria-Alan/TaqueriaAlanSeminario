trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

parameters:
  - name: services
    type: object
    default:
      - auth-service
      - catalogo-service
      - pedidos-service
      - pagos-service
      - club-alan-service

variables:
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
  azureSubscription: 'AzureServiceConnection'

stages:
  - stage: Build
    displayName: 'Build y pruebas'
    jobs:
      - job: BuildAndTest
        steps:
          - task: Cache@2
            inputs:
              key: 'maven | "$(Agent.OS)" | **/pom.xml'
              restoreKeys: |
                maven | "$(Agent.OS)"
              path: $(MAVEN_CACHE_FOLDER)
            displayName: Cache Maven local repository

          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '21'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'
            displayName: Configurar JDK 21

          - task: Maven@4
            displayName: Build y tests (mvn clean verify)
            inputs:
              mavenPomFile: 'pom.xml'
              goals: 'clean verify'
              options: '$(MAVEN_OPTS)'
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.21'
              mavenVersionOption: 'Default'

          - ${{ each svc in parameters.services }}:
              - task: CopyFiles@2
                displayName: 'Copiar jar de ${{ svc }}'
                inputs:
                  SourceFolder: '$(System.DefaultWorkingDirectory)/src/${{ svc }}/target'
                  Contents: '*.jar'
                  TargetFolder: '$(Build.ArtifactStagingDirectory)/${{ svc }}'
              - publish: '$(Build.ArtifactStagingDirectory)/${{ svc }}'
                artifact: '${{ svc }}-jar'
                displayName: 'Publicar artefacto de ${{ svc }}'

  - stage: Deploy
    displayName: 'Despliegue a Azure App Service'
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - ${{ each svc in parameters.services }}:
          - deployment: Deploy_${{ replace(svc, '-', '_') }}
            displayName: 'Deploy ${{ svc }}'
            environment: 'production-${{ svc }}'
            pool:
              vmImage: 'ubuntu-latest'
            strategy:
              runOnce:
                deploy:
                  steps:
                    - task: AzureWebApp@1
                      displayName: 'Publicar ${{ svc }} en App Service'
                      inputs:
                        azureSubscription: '$(azureSubscription)'
                        appType: 'webAppLinux'
                        appName: 'taqueria-${{ svc }}'
                        runtimeStack: 'JAVA|21-java21'
                        package: '$(Pipeline.Workspace)/${{ svc }}-jar/*.jar'
