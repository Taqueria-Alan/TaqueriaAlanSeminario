services:

  mysql:
    # Jenkins se ejecuta en un contenedor y su workspace es un volumen Docker.
    # Los bind mounts del workspace no son visibles para el daemon anfitrión;
    # por eso los scripts de bootstrap se incluyen en una imagen reproducible.
    image: taqueria/mysql-bootstrap:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: mysql/Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taqueria_db}
      MYSQL_USER: ${MYSQL_USER:-taqueria}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - taqueria-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - taqueria-network

  # Se ejecuta en cada levantamiento y deja la migración 04 aplicada incluso
  # cuando mysql-data ya existía antes de incorporar el flujo de pedidos.
  db-migrations:
    # La migración también se empaqueta en una imagen: así funciona tanto
    # desde Docker Desktop como desde Jenkins usando Docker-outside-of-Docker.
    image: taqueria/db-migrations:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: migrations/Dockerfile
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taqueria_db}
      MYSQL_USER: ${MYSQL_USER:-taqueria}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    command:
      - /bin/sh
      - -ec
      - |
        attempt=1
        until mysqladmin --protocol=tcp ping -h mysql -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" --silent; do
          if [ "$$attempt" -ge 30 ]; then
            echo "MySQL no estuvo disponible para aplicar la migracion tras 30 intentos" >&2
            exit 1
          fi
          echo "Esperando MySQL para aplicar la migracion ($$attempt/30)..."
          attempt=$$((attempt + 1))
          sleep 2
        done
        mysql --protocol=tcp -h mysql -u"$${MYSQL_USER}" -p"$${MYSQL_PASSWORD}" "$${MYSQL_DATABASE}" < /migrations/04-pedidos-pagos.sql
    networks:
      - taqueria-network

  auth-service:
    image: taqueria/auth:${IMAGE_TAG:-local}
    build:
      context: ../src/auth-service
      dockerfile: ../../docker/auth/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-taqueria_db}
      DB_USER: ${MYSQL_USER:-taqueria}
      DB_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "${SERVICE_PORT_8081:-8081}:8081"
    networks:
      - taqueria-network

  catalogo-service:
    image: taqueria/catalogo:${IMAGE_TAG:-local}
    build:
      context: ../src/catalogo-service
      dockerfile: ../../docker/catalogo/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-taqueria_db}
      DB_USER: ${MYSQL_USER:-taqueria}
      DB_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "${SERVICE_PORT_8082:-8082}:8082"
    networks:
      - taqueria-network

  pedidos-service:
    image: taqueria/pedidos:${IMAGE_TAG:-local}
    build:
      context: ../src/pedidos-service
      dockerfile: ../../docker/pedidos/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
      catalogo-service:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-taqueria_db}
      DB_USER: ${MYSQL_USER:-taqueria}
      DB_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: local
      SECURITY_ENABLED: "false"
    ports:
      - "${SERVICE_PORT_8083:-8083}:8083"
    networks:
      - taqueria-network

  pagos-service:
    image: taqueria/pagos:${IMAGE_TAG:-local}
    build:
      context: ../src/pagos-service
      dockerfile: ../../docker/pagos/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
      pedidos-service:
        condition: service_started
      club-alan-service:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-taqueria_db}
      DB_USER: ${MYSQL_USER:-taqueria}
      DB_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: local
      CLUB_ALAN_BASE_URL: http://club-alan-service:8085
      CLUB_ALAN_ENABLED: "true"
    ports:
      - "${SERVICE_PORT_8084:-8084}:8084"
    networks:
      - taqueria-network

  club-alan-service:
    image: taqueria/club-alan:${IMAGE_TAG:-local}
    build:
      context: ../src/club-alan-service
      dockerfile: ../../docker/club-alan/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrations:
        condition: service_completed_successfully
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-taqueria_db}
      DB_USER: ${MYSQL_USER:-taqueria}
      DB_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "${SERVICE_PORT_8085:-8085}:8085"
    networks:
      - taqueria-network

volumes:
  mysql-data:

networks:
  taqueria-network:
    driver: bridge
