services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taqueria_db}
      MYSQL_USER: ${MYSQL_USER:-taqueria}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-changeme}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - taqueria-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - taqueria-network

  auth-service:
    image: taqueria/auth:${IMAGE_TAG:-local}
    build:
      context: ../src/auth-service
      dockerfile: ../../docker/auth/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-taqueria_db}
      DB_USER: ${MYSQL_USER:-taqueria}
      DB_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "${SERVICE_PORT_8081:-8081}:8081"
    networks:
      - taqueria-network

  catalogo-service:
    image: taqueria/catalogo:${IMAGE_TAG:-local}
    build:
      context: ../src/catalogo-service
      dockerfile: ../../docker/catalogo/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-taqueria_db}
      DB_USER: ${MYSQL_USER:-taqueria}
      DB_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "${SERVICE_PORT_8082:-8082}:8082"
    networks:
      - taqueria-network

  pedidos-service:
    image: taqueria/pedidos:${IMAGE_TAG:-local}
    build:
      context: ../src/pedidos-service
      dockerfile: ../../docker/pedidos/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      catalogo-service:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-taqueria_db}
      DB_USER: ${MYSQL_USER:-taqueria}
      DB_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "${SERVICE_PORT_8083:-8083}:8083"
    networks:
      - taqueria-network

  pagos-service:
    image: taqueria/pagos:${IMAGE_TAG:-local}
    build:
      context: ../src/pagos-service
      dockerfile: ../../docker/pagos/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      pedidos-service:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-taqueria_db}
      DB_USER: ${MYSQL_USER:-taqueria}
      DB_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "${SERVICE_PORT_8084:-8084}:8084"
    networks:
      - taqueria-network

volumes:
  mysql-data:

networks:
  taqueria-network:
    driver: bridge
