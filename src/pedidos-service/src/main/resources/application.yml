server:
  port: 8083

spring:
  application:
    name: pedidos-service
  profiles:
    default: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taqueria_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:root}}
    hikari:
      data-source-properties:
        sslMode: ${DB_SSL_MODE:REQUIRED}
        enabledTLSProtocols: TLSv1.2
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        # El esquema heredado usa tablas en mayúsculas y MySQL sobre Linux
        # distingue CLIENTE de cliente. Se conserva el contrato físico exacto.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:true}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  pedidos:
    producto-membresia-id: ${MEMBRESIA_PRODUCTO_ID:1}
  security:
    enabled: ${SECURITY_ENABLED:true}
    jwt-secret: ${JWT_SECRET:}
