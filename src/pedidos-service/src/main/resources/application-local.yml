    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:taqueria_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
  data:
    redis:
      ssl:
        enabled: false

app:
  security:
    enabled: ${SECURITY_ENABLED:false}
