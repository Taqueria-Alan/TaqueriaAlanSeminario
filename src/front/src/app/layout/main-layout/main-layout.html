<mat-sidenav-container class="layout">
  <mat-sidenav
    #drawer
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
    class="sidenav"
  >
    <a class="brand" href="/" title="Ver sitio publico">
      <img class="brand__logo" src="images/logo-alan.png" alt="Logotipo Taqueria Alan" />
      <span class="brand__text">
        Taqueria Alan
        <small>Panel administrativo</small>
      </span>
    </a>

    <mat-nav-list (click)="drawer.mode === 'over' && drawer.close()">
      <a
        mat-list-item
        routerLink="/admin/catalogo/categorias"
        routerLinkActive="active-link"
        [routerLinkActiveOptions]="{ exact: false }"
      >
        <mat-icon matListItemIcon>menu_book</mat-icon>
        <span matListItemTitle>Catalogo</span>
      </a>
      <a
        mat-list-item
        routerLink="/admin/catalogo/productos"
        routerLinkActive="active-link"
      >
        <mat-icon matListItemIcon>lunch_dining</mat-icon>
        <span matListItemTitle>Productos</span>
      </a>
      <a
        mat-list-item
        routerLink="/admin/club-alan/puntos"
        routerLinkActive="active-link"
      >
        <mat-icon matListItemIcon>loyalty</mat-icon>
        <span matListItemTitle>Puntos Club Alan</span>
      </a>
      <a
        mat-list-item
        routerLink="/admin/club-alan/movimientos"
        routerLinkActive="active-link"
      >
        <mat-icon matListItemIcon>receipt_long</mat-icon>
        <span matListItemTitle>Movimientos</span>
      </a>
      <a
        mat-list-item
        routerLink="/admin/club-alan/membresia"
        routerLinkActive="active-link"
      >
        <mat-icon matListItemIcon>card_membership</mat-icon>
        <span matListItemTitle>Membresia</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="app-toolbar">
      @if (isHandset()) {
        <button mat-icon-button (click)="drawer.toggle()" aria-label="Abrir menu">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <img class="app-toolbar__logo" src="images/logo-alan.png" alt="" />
      <span>Taqueria Alan</span>
    </mat-toolbar>
    <main class="contenido">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
