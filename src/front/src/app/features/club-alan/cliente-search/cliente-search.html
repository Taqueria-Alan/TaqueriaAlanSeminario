<mat-form-field appearance="outline" class="cliente-search">
  <mat-label>Buscar cliente por nombre o telefono</mat-label>
  <input
    matInput
    [formControl]="control"
    [matAutocomplete]="auto"
    placeholder="Ej. Juan Perez o 5021234567"
  />
  <mat-icon matSuffix>search</mat-icon>
  <mat-autocomplete
    #auto="matAutocomplete"
    [displayWith]="mostrarCliente"
    (optionSelected)="onOpcionSeleccionada($event)"
  >
    @for (cliente of (opciones$ | async); track cliente.idCliente) {
      <mat-option [value]="cliente">
        {{ cliente.nombre }} @if (cliente.telefono) {
          <span class="telefono">({{ cliente.telefono }})</span>
        }
      </mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
