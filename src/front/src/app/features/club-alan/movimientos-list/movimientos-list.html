<div class="movimientos-list">
  <app-cliente-search (clienteSeleccionado)="onClienteSeleccionado($event)" />

  @if (loading) {
    <app-loading-spinner message="Cargando movimientos..." />
  } @else if (buscado && movimientos.length === 0) {
    <app-empty-state icon="receipt_long" message="Este cliente no tiene movimientos registrados" />
  } @else if (movimientos.length > 0) {
    <table mat-table [dataSource]="movimientos" class="mat-elevation-z1">
      <ng-container matColumnDef="tipo">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>
        <td mat-cell *matCellDef="let movimiento">
          <mat-chip [class]="movimiento.tipo === 'CANJE' ? 'chip-canje' : 'chip-acumulacion'">
            {{ movimiento.tipo }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="puntos">
        <th mat-header-cell *matHeaderCellDef>Puntos</th>
        <td mat-cell *matCellDef="let movimiento" [class.negativo]="movimiento.puntos < 0">
          {{ movimiento.puntos > 0 ? '+' : '' }}{{ movimiento.puntos }}
        </td>
      </ng-container>

      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let movimiento">{{ movimiento.fecha | date: 'short' }}</td>
      </ng-container>

      <ng-container matColumnDef="descripcion">
        <th mat-header-cell *matHeaderCellDef>Descripcion</th>
        <td mat-cell *matCellDef="let movimiento">{{ movimiento.descripcion || '-' }}</td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columnas"></tr>
      <tr mat-row *matRowDef="let row; columns: columnas"></tr>
    </table>

    <mat-paginator
      [length]="totalElements"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="[5, 10, 25]"
      (page)="cambiarPagina($event)"
    />
  }
</div>
