server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
            allowedMethods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowedHeaders: '*'
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin RETAIN_UNIQUE
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: catalogo-service
          uri: ${CATALOGO_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/catalogo/**
        - id: pedidos-service
          uri: ${PEDIDOS_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/pedidos/**
        - id: pagos-service
          uri: ${PAGOS_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/pagos/**
        - id: club-alan-service
          uri: ${CLUB_ALAN_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/club-alan/**
